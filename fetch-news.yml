name: Actualizar noticias

on:
  schedule:
    # Corre a las 09:00, 13:00, 17:00 y 21:00 UTC (06:00, 10:00, 14:00 y 18:00 Argentina)
    - cron: '0 9,13,17,21 * * *'
  workflow_dispatch: {} # permite ejecutarlo a mano desde la pestaña "Actions" de GitHub

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Buscar noticias y generar news.json
        run: node scripts/fetch-news.js

      - name: Commitear news.json si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || git commit -m "chore: actualizar noticias [skip ci]"
          git push
